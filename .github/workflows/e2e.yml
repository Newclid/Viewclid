name: End-to-End Tests
on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/actions/setup-backend-toolchain/**"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/actions/setup-backend-toolchain/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-backend:
    name: Frontend and backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up backend toolchain
        uses: ./.github/actions/setup-backend-toolchain

      - name: Install backend
        working-directory: backend
        run: uv sync --extra test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend and frontend
        # This test only checks that a job gets enqueued (see
        # tests/e2e/frontend-backend/submit-job.e2e.spec.ts), so no worker
        # process is started here.
        run: |
          cd backend && uv run uvicorn newclid_backend.main:app --host 127.0.0.1 --port 8000 &
          cd frontend && npm run dev -- --host 127.0.0.1 --port 5173 &

      - name: Wait for services and run Playwright tests
        working-directory: frontend
        run: |
          for url in http://127.0.0.1:8000/api/health http://127.0.0.1:5173; do
            for _ in $(seq 1 30); do curl -sf "$url" >/dev/null && break; sleep 1; done
          done
          npm run test:e2e:frontend-backend

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
